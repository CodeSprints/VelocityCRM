[package]
name = "velocitycrm"
version = "2.0.0"
description = "VelocityCRM – uniwersalna platforma CRM dla web, desktop i mobile."
authors = ["VelocityCRM contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "velocitycrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
